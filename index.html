
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eighteen little surprises for Nikki's birthday.">
  <title>Happy Birthday, Nikki ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #11101a;
      --panel: #1c1928;
      --purple: #b99be8;
      --light-purple: #d9c9f2;
      --muted: #a39aaf;
      --text: #f4effa;
      --border: rgba(185, 155, 232, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 50px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(110, 79, 150, 0.17), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      color: var(--purple);
      opacity: 0.55;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    .star:nth-child(1) { top: 9%; left: 12%; font-size: 18px; }
    .star:nth-child(2) { top: 18%; right: 15%; font-size: 13px; animation-delay: 1s; }
    .star:nth-child(3) { top: 43%; left: 6%; font-size: 22px; animation-delay: 1.5s; }
    .star:nth-child(4) { top: 58%; right: 8%; font-size: 17px; animation-delay: .5s; }
    .star:nth-child(5) { bottom: 13%; left: 17%; font-size: 14px; animation-delay: 2s; }
    .star:nth-child(6) { bottom: 20%; right: 18%; font-size: 22px; animation-delay: 1.2s; }
    .star:nth-child(7) { top: 30%; left: 25%; font-size: 10px; animation-delay: .8s; }
    .star:nth-child(8) { top: 75%; right: 30%; font-size: 12px; animation-delay: 1.8s; }

    @keyframes twinkle {
      from { opacity: .25; transform: scale(.85); }
      to { opacity: .9; transform: scale(1.15); }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      text-align: center;
    }

    header {
      margin: 35px 0 65px;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 8vw, 66px);
      font-weight: 500;
      line-height: 1.2;
      margin: 0;
      color: var(--light-purple);
    }

    .intro {
      color: var(--muted);
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.8;
    }

    .countdown {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 23px;
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--purple);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .section-heading {
      font-family: 'Playfair Display', serif;
      font-size: 29px;
      font-weight: 500;
      color: var(--light-purple);
      margin-bottom: 28px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .day {
      min-height: 135px;
      padding: 20px 12px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(28, 25, 40, 0.85);
      color: var(--text);
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform .2s, border-color .2s, background .2s;
    }

    .day:not(:disabled) {
      cursor: pointer;
    }

    .day:not(:disabled):hover {
      transform: translateY(-4px);
      border-color: var(--purple);
      background: #252033;
    }

    .day:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .day-number {
      color: var(--purple);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .day-name {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      line-height: 1.4;
    }

    .day-status {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 65px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      padding: 20px;
      background: rgba(8, 7, 14, .82);
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 45px 30px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      text-align: center;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-day {
      color: var(--purple);
      font-size: 10px;
      letter-spacing: 4px;
    }

    .modal-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 500;
      color: var(--light-purple);
      margin: 17px 0;
    }

    .modal-content p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
    }

    .close {
      margin-top: 25px;
      padding: 11px 25px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: transparent;
      color: var(--light-purple);
      font-family: inherit;
      cursor: pointer;
    }

    .close:hover {
      background: rgba(185, 155, 232, .12);
    }

    .gift-link {
      display: inline-block;
      margin-top: 15px;
      color: var(--light-purple);
      text-decoration: none;
      border-bottom: 1px solid var(--purple);
      padding-bottom: 4px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body {
        padding: 35px 15px;
      }

      header {
        margin-top: 30px;
        margin-bottom: 50px;
      }

      .days {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .day {
        min-height: 125px;
        padding: 16px 8px;
      }

      .day-name {
        font-size: 15px;
      }

      .modal-content {
        padding: 40px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="stars" aria-hidden="true">
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">·</span>
    <span class="star">·</span>
  </div>

  <main>
    <header>
      <div class="eyebrow">a little something made for you</div>

      <h1>happy 15th birthday,<br>nikki ♡</h1>

      <p class="intro">
        eighteen little surprises, one day at a time.
      </p>

      <div class="countdown" id="countdown">
        YOUR BIRTHDAY COUNTDOWN
      </div>
    </header>

    <h2 class="section-heading">your eighteen days</h2>

    <section class="days" id="days" aria-label="Birthday surprises"></section>

    <footer>made with so much thought ♡</footer>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="modal-day" id="modal-day"></div>

      <h2 id="modal-title"></h2>

      <p id="modal-body"></p>

      <a class="gift-link" id="modal-link" href="#" target="_blank" rel="noopener noreferrer" hidden></a>

      <button class="close" id="close-button" type="button">
        close ♡
      </button>
    </div>
  </div>

  <script>
    /*
      EDIT YOUR GIFTS HERE.

      Each gift has:
      title: the name shown on the day
      body: the message shown when Nikki opens it
      link: optional website link
      linkLabel: optional text for that link

      You can change these whenever you want.
    */

    const gifts = [
      {
        title: "a little introduction",
        body: "A little beginning to eighteen days of surprises. ♡"
      },
      {
        title: "a cookie recipe",
        body: "A sweet little recipe for us to make together someday. ♡"
      },
      {
        title: "a playlist",
        body: "A collection of songs that made me think of you."
      },
      {
        title: "trivia about us",
        body: "How well do you remember all our little moments? ♡"
      },
      {
        title: "a poem",
        body: "A little something written just for you."
      },
      {
        title: "movie night",
        body: "A little collection of movies for a future movie night together."
      },
      {
        title: "100 reasons",
        body: "One hundred little reasons why you mean so much to me."
      },
      {
        title: "things i've never told you",
        body: "Some things I've wanted to tell you for a while. ♡"
      },
      {
        title: "a special letter",
        body: "A letter with a little extra love in every word."
      },
      {
        title: "things i want to do",
        body: "A collection of little and big things I want us to experience together."
      },
      {
        title: "things that remind me of you",
        body: "All the little things that somehow always lead me back to you."
      },
      {
        title: "surprise twelve",
        body: "A little surprise is waiting for you. ♡"
      },
      {
        title: "surprise thirteen",
        body: "A little surprise is waiting for you. ♡"
      },
      {
        title: "surprise fourteen",
        body: "A little surprise is waiting for you. ♡"
      },
      {
        title: "surprise fifteen",
        body: "A little surprise is waiting for you. ♡"
      },
      {
        title: "surprise sixteen",
        body: "A little surprise is waiting for you. ♡"
      },
      {
        title: "surprise seventeen",
        body: "A little surprise is waiting for you. ♡"
      },
      {
        title: "your birthday",
        body: "Happy birthday, my love. ♡"
      }
    ];

    const birthdayDate = "2026-12-18";

    function getChicagoDate() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Chicago",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const values = {};

      parts.forEach(part => {
        values[part.type] = part.value;
      });

      return `${values.year}-${values.month}-${values.day}`;
    }

    function updateCountdown() {
      const today = getChicagoDate();
      const countdown = document.getElementById("countdown");

      if (today >= birthdayDate) {
        countdown.textContent = "HAPPY BIRTHDAY, NIKKI ♡";
        return;
      }

      const todayDate = new Date(`${today}T12:00:00Z`);
      const targetDate = new Date(`${birthdayDate}T12:00:00Z`);

      const days = Math.ceil(
        (targetDate - todayDate) / (1000 * 60 * 60 * 24)
      );

      countdown.textContent = `${days} DAYS UNTIL YOUR BIRTHDAY`;
    }

    function renderDays() {
      const container = document.getElementById("days");
      const today = getChicagoDate();

      container.innerHTML = "";

      gifts.forEach((gift, index) => {
        const number = index + 1;
        const date = `2026-12-${String(number).padStart(2, "0")}`;
        const unlocked = today >= date;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";
        button.disabled = !unlocked;

        const dayNumber = document.createElement("span");
        dayNumber.className = "day-number";
        dayNumber.textContent = `DAY ${String(number).padStart(2, "0")}`;

        const dayName = document.createElement("span");
        dayName.className = "day-name";
        dayName.textContent = gift.title;

        const dayStatus = document.createElement("span");
        dayStatus.className = "day-status";
        dayStatus.textContent = unlocked
          ? "✦ open your surprise"
          : "✧ still waiting";

        button.append(dayNumber, dayName, dayStatus);

        if (unlocked) {
          button.addEventListener("click", () => openGift(number));
        }

        container.appendChild(button);
      });
    }

    function openGift(number) {
      const today = getChicagoDate();
      const date = `2026-12-${String(number).padStart(2, "0")}`;

      if (today < date) return;

      const gift = gifts[number - 1];

      document.getElementById("modal-day").textContent =
        `DAY ${String(number).padStart(2, "0")}`;

      document.getElementById("modal-title").textContent = gift.title;
      document.getElementById("modal-body").textContent = gift.body || "";

      const link = document.getElementById("modal-link");

      if (gift.link) {
        link.href = gift.link;
        link.textContent = gift.linkLabel || "open your surprise ♡";
        link.hidden = false;
      } else {
        link.hidden = true;
        link.removeAttribute("href");
        link.textContent = "";
      }

      document.getElementById("modal").classList.add("show");
      document.getElementById("close-button").focus();
    }

    function closeGift() {
      document.getElementById("modal").classList.remove("show");
    }

    document.getElementById("close-button").addEventListener("click", closeGift);

    document.getElementById("modal").addEventListener("click", event => {
      if (event.target.id === "modal") {
        closeGift();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeGift();
      }
    });

    updateCountdown();
    renderDays();
  </script>

</body>
</html>
