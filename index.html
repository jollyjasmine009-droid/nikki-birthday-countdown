<!DOCTYPE html>
<html>
<head>
<meta>
<meta>
<title>Happy Birthday, Nikki ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');

:root {
  --bg: #11101a;
  --panel: #1c1928;
  --purple: #b99be8;
  --pale: #e8e0f3;
  --muted: #aaa1b9;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #29203d, var(--bg) 65%);
  color: var(--pale);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 15% 20%, #fff 50%, transparent),
    radial-gradient(2px 2px at 75% 35%, #c9a9ff 50%, transparent),
    radial-gradient(1px 1px at 45% 75%, #fff 50%, transparent),
    radial-gradient(2px 2px at 90% 85%, #d6c3ff 50%, transparent);
  background-size: 220px 220px;
  opacity: .55;
}
main {
  position: relative;
  width: min(900px, 92%);
  margin: auto;
  padding: 70px 0;
}
header { text-align: center; padding: 45px 10px 55px; }
.eyebrow {
  color: var(--purple);
  letter-spacing: .25em;
  font-size: 11px;
  text-transform: uppercase;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 8vw, 76px);
  line-height: 1.1;
  margin: 22px 0;
}
header p { color: var(--muted); }
.countdown {
  color: var(--purple);
  margin-top: 30px;
  font-size: 13px;
  letter-spacing: .1em;
}
.section-heading {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 27px;
  margin: 25px 0;
}
.days {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}
.day {
  min-height: 125px;
  padding: 20px 12px;
  border: 1px solid #514365;
  border-radius: 15px;
  background: #201b2c;
  color: var(--pale);
  cursor: pointer;
  text-align: center;
  transition: .2s;
}
.day:hover:not(:disabled) {
  transform: translateY(-4px);
  border-color: var(--purple);
}
.day:disabled { opacity: .48; cursor: default; }
.day-number { color: var(--purple); font-size: 12px; letter-spacing: .12em; }
.day-name { display: block; margin-top: 12px; font-size: 14px; }
.day-status { display: block; color: var(--muted); font-size: 11px; margin-top: 8px; }
footer { text-align: center; color: var(--muted); padding: 55px 10px 10px; font-size: 12px; }
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  background: #090811dd;
  padding: 20px;
  align-items: center;
  justify-content: center;
}
.modal.show { display: flex; }
.modal-content {
  width: min(520px, 100%);
  max-height: 85vh;
  overflow-y: auto;
  padding: 35px 25px;
  border: 1px solid #786195;
  border-radius: 20px;
  background: #211b30;
  text-align: center;
}
.modal-content h2 { font-family: 'Playfair Display', serif; font-size: 30px; }
.modal-content p { white-space: pre-wrap; line-height: 1.8; color: var(--pale); }
.close {
  margin-top: 20px;
  padding: 11px 24px;
  border: 1px solid var(--purple);
  border-radius: 30px;
  background: transparent;
  color: var(--pale);
  cursor: pointer;
}
@media(max-width: 550px) {
  main { padding-top: 30px; }
  .days { grid-template-columns: repeat(2, 1fr); }
  .day { min-height: 115px; }
}
</style>
</head>
<body>
<div></div>
<main>
<header>
  <div>a little something made for you</div>
  <h1>happy 15th birthday,<br>nikki ♡</h1>
  <p>eighteen little surprises, one day at a time.</p>
  <div>YOUR BIRTHDAY COUNTDOWN</div>
</header>

<h2>your eighteen days</h2>
<section></section>

<footer>made with so much thought ♡</footer>
</main>

<div>
  <div>
    <div></div>
    <h2></h2>
    <p></p>
    <button>close ♡</button>
  </div>
</div>

<script>
const gifts = [
  { title: "a little introduction", body: "Welcome to your birthday countdown! There are eighteen little surprises waiting for you. I hope each one makes your day a little more special." },
  { title: "a cookie recipe", body: "Your cookie recipe will go here ♡" },
  { title: "a playlist", body: "Your playlist link will go here ♡" },
  { title: "trivia about us", body: "Your trivia will go here ♡" },
  { title: "a poem", body: "Your poem will go here ♡" },
  { title: "movie night", body: "Your movie list will go here ♡" },
  { title: "100 reasons", body: "Your 100 reasons will go here ♡" },
  { title: "things i've never told you", body: "Your letter will go here ♡" },
  { title: "a special letter", body: "Your letter will go here ♡" },
  { title: "things i want to do", body: "Your list will go here ♡" },
  { title: "things that remind me of you", body: "Your list will go here ♡" },
  ...Array.from({length: 7}, () => ({ title: "a little surprise", body: "Your gift will go here ♡" }))
];

function chicagoDate() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Chicago",
    year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
}

function renderDays() {
  const today = chicagoDate();
  const container = document.getElementById("days");

  gifts.forEach((gift, index) => {
    const number = index + 1;
    const date = '2026-12-${String(number).padStart(2, "0")}';
    const unlocked = today >= date;
    const button = document.createElement("button");
    button.className = "day";
    button.disabled = !unlocked;
    button.innerHTML = '
      <span>DAY ${String(number).padStart(2, "0")}</span>
      <span>${gift.title}</span>
      <span>${unlocked ? "✦ open your surprise" : "✧ still waiting"}</span>
    ';
    if (unlocked) button.addEventListener("click", () => openGift(number));
    container.appendChild(button);
  });
}

function openGift(number) {
  const gift = gifts[number - 1];
  document.getElementById("modal-day").textContent = 'DAY ${number}';
  document.getElementById("modal-title").textContent = gift.title;
  document.getElementById("modal-body").textContent = gift.body;
  document.getElementById("modal").classList.add("show");
}

function closeGift() {
  document.getElementById("modal").classList.remove("show");
}

function updateCountdown() {
  const today = chicagoDate();
  const birthday = new Date("2026-12-18T12:00:00-06:00");
  const now = new Date();
  const days = Math.max(0, Math.ceil((birthday - now) / 86400000));
  document.getElementById("countdown").textContent =
    today >= "2026-12-18" ? "TODAY IS YOUR DAY ♡" : '${days} DAYS UNTIL YOUR BIRTHDAY';
}

renderDays();
updateCountdown();
</script>
</body>
</html>
